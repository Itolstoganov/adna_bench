name: adna-eval
channels:
  - conda-forge
  - bioconda
dependencies:
  - ncbi-genome-download
  - ncbi-datasets-cli
  - mason=2.0.9
  - snakemake-minimal=9.13.7
  - snakemake-executor-plugin-slurm
  - python=3.13
  - pysam
  - dnaio
  - bwa
  - samtools
  - cmake=3.27
  - cxx-compiler
  - seaborn
  - pandas
  - minimap2
  - isa-l
  - pyyaml
  - pyfaidx
  - fastp
  - gargammel
  - zlib
  - singularity
  - bcftools
  # Build/runtime deps for the gargammel FORK (compiled from the submodule; the
  # conda `gargammel` above lacks the fork's deaminated-position output):
  - make
  - gsl
  - seq-gen
  - perl

