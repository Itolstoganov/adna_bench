# aMeta config for the metagenomic benchmark (profiler: aMeta-malt).
#
# Bowtie2 (pathogen screen) and mapDamage are DISABLED — the benchmark scores the
# MALT taxonomic profile, not the pathogen screen, so we skip that compute via the
# analyses.bowtie2 toggle (see the aMeta fork's bowtie2-skip option). Keeping
# mapdamage off is required when bowtie2 is off.
#
# run.sh generates config/samples.tsv (pointing at the simulated reads) into the
# run directory before launching aMeta, so leave `samplesheet` as-is.
#
# EDIT the DATABASE paths below on the server (identical to
# meta_bench/runs/sim_dataset/config/config.yaml). bowtie2_db / pathogenomesFound
# are still schema-checked even though the bowtie2 step is skipped, so they must
# point at real files (or harmless placeholders that exist).

samplesheet: config/samples.tsv
samples:
  exclude: []

analyses:
  bowtie2: false
  mapdamage: false
  authentication: true
  malt: true

adapters:
  illumina: true
  nextera: false
  custom: []

# ---- DATABASES: set these on the server (see runs/sim_dataset/config.yaml) ----
krakenuniq_db: /PATH/TO/KrakenUniq_RefSeq_DB
bowtie2_db: /PATH/TO/library.pathogen.fna
bowtie2_seqid2taxid_db: /PATH/TO/seqid2taxid.pathogen.map
pathogenomesFound: /PATH/TO/pathogensfound.tab
malt_nt_fasta: resources/malt/library.fna
malt_seqid2taxid_db: resources/malt/seqid2taxid.map
malt_accession2taxid: resources/malt/nucl.accession2taxid
ncbi_db: resources/ncbi

n_unique_kmers: 1000
n_tax_reads: 200

# Backend. Left at the default (malt) here; run.sh overrides it to
# aligner_ngslca for the aMeta-ngslca profiler. The aligner block below is only
# used in that case. ngsLCA reuses names.dmp/nodes.dmp derived from krakenuniq_db's
# taxDB and malt_accession2taxid for -acc2tax.
taxonomic_profiler: malt
aligner:
  name: strobealign
  repo: "https://github.com/ksahlin/strobealign"
  ref: "cc24cbd434f4ea7dd3c7fd344e3aaaf774cf4c13"
  args: "--ancient-dna --mcs=always -S 0.95 -r 30 -k 12"
  max_secondary: 20
ngslca_args: "-simscorelow 0.85 -simscorehigh 1.0"
