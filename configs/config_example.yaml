# Datasets to simulate or benchmark
# Each dataset can be specified as:
# 1. Single instance with all parameters defined
# 2. Range specification where parameters can be lists to create combinations

datasets:
  # Example single instance dataset
  # - name: "chr21_var3"
  #   endogenous_genome: "chr21_chm13"
  #   contaminant_genome: "chr21_chm13"
  #   endogenous_variation: "var3"
  #   bacterial_db: "k14"
  #   read_length: 40
  #   proportions: [0.7, 0.00, 0.3]  # [endogenous, contaminant, bacterial] 

  - name: "fruitfly"
    endogenous_genome: "fruitfly"
    contaminant_genome: "fruitfly"
    endogenous_variation: ["var0p1", "var0p5", "var2", "var5"]
    bacterial_db: "k14"
    read_length: [40]
    proportions: [0.2, 0.00, 0.8]  # [bacterial, contaminant, endogenous]

    # Accuracy evaluation parameters
    score_thresholds: [60, 70, 80]
    k: [11, 13, 15, 17, 19, 21]
    # k: [13, 15, 17, 19, 21, 25, 31]
    main_score_threshold: 60
    main_k: 17
    # s = k - syncmer_density + 1
    syncmer_density: 5

    # Secondary-alignment accuracy: a read is correct if a secondary alignment
    # tied on score with the primary overlaps the truth. Off by default. 
    # Enable here or via `run.py --secondary-accuracy`.
    # Not yet applicable to bwaaln / safari. strobealign uses -N (bounded by -M, depends on -S).
    secondary_accuracy: false
    secondary_n: 100
    secondary_m: 100
    secondary_s: 0.5

    num_reads: 500000

# Alignment parameters
versions:
  - commit: "59c49f31a6283dcf8fff3fa84a90453b599363af" 
    color: "green"
    name: "strobealign --adna (backup)"
    arguments: "--adna --ry-len 8 -M 500 --ssw"

  # - commit: "15e43182765c3a13a1049c0b7eb07fd60074d8d8"
  #   color: "red"
  #   name: "strobealign main (15e4318)"
  #   arguments: "--mcs=always -S 0.95 -r 30 -k 12"

programs:
 - bwaaln
