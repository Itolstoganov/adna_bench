datasets:
  - name: "fruitfly"
    endogenous_genome: "fruitfly"
    contaminant_genome: "fruitfly"
    endogenous_variation: ["var0p5", "var5"]
    bacterial_db: "k14"
    read_length: [40]
    proportions: [0.2, 0.00, 0.8]  # [bacterial, contaminant, endogenous]

num_reads: 5000

# Separate output tree so test runs do not touch the full benchmark results.
output_dir: "simx/test"

score_thresholds: [60, 70, 80]
k: [19, 21]
main_score_threshold: 60
main_k: 19
# s = k - syncmer_density + 1
syncmer_density: 3

secondary_accuracy: false

# Keep versions and programs in sync with config.yaml.
versions:
  - commit: "4be2dcc208fa54a8c8caed2146adf116f52c382c"
    color: "green"
    name: "Strobealign-HRY"
    arguments: "--adna --ry-len 8 -M 500 --ssw"

  - commit: "4be2dcc208fa54a8c8caed2146adf116f52c382c"
    color: "green"
    name: "Strobealign-DK"
    arguments: "-l 1 -u 1 -M 500"

ends:
  - se

programs:
  - bwaaln
  - bwamem
  - bowtie2
