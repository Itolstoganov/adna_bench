# Datasets to simulate or benchmark
# Each dataset can be specified as:
# 1. Single instance with all parameters defined
# 2. Range specification where parameters can be lists to create combinations

datasets:
  # Example single instance dataset
  # - name: "chr21"
  #   endogenous_genome: "chr21_chm13"
  #   contaminant_genome: "chr21_chm13"
  #   endogenous_variation: ["var3", "var5"]
  #   bacterial_db: "k14"
  #   read_length: [40, 80]
  #   proportions: [0.7, 0.00, 0.3]

  # Example range specification 
  # - name: "chr21_variations"
  #   endogenous_genome: "chr21-chm13"
  #   contaminant_genome: "chr21-chm1"
  #   endogenous_variation: ["var1", "var3", "var4"]
  #   bacterial_db: "k14"
  #   read_length: [40, 60, 80]
  #   proportions: [[0.6, 0.05, 0.35], [0.8, 0.05, 0.15]]  # Multiple proportion combinations

  - name: "fruitfly"
    endogenous_genome: "fruitfly"
    contaminant_genome: "fruitfly"
    endogenous_variation: ["var0p5", "var2", "var5"]
    bacterial_db: "k14"
    read_length: [40]
    proportions: [0.2, 0.00, 0.8]  # [bacterial, contaminant, endogenous] 

  - name: "zymo"
    endogenous_genome: "zymo"
    contaminant_genome: "zymo"
    endogenous_variation: ["var0p5", "var2", "var5"]
    bacterial_db: "k14"
    read_length: [40]
    proportions: [0.2, 0.00, 0.8]  # [bacterial, contaminant, endogenous]

  - name: "chm13"
    endogenous_genome: "CHM13"
    contaminant_genome: "CHM13"
    endogenous_variation: ["var0p5", "var2", "var5"]
    bacterial_db: "k14"
    read_length: [40]
    proportions: [0.2, 0.00, 0.8]

# Gargammel simulation parameters
num_reads: 500000

# Accuracy evaluation parameters
score_thresholds: [60, 70, 80]
k: [13, 15, 17, 19, 21]
# k: [13, 15, 17, 19, 21, 25, 31]
main_score_threshold: 60
main_k: 17
# s = k - syncmer_density + 1
syncmer_density: 3

# Secondary-alignment accuracy: a read is correct if a secondary alignment
# tied on score with the primary overlaps the truth. Off by default. 
# Enable here or via `run.py --secondary-accuracy`.
# Not yet applicable to bwaaln / safari. strobealign uses -N (bounded by -M, depends on -S).
secondary_accuracy: false
secondary_n: 100
secondary_m: 100
secondary_s: 0.5

# Alignment parameters
versions:
  - commit: "4be2dcc208fa54a8c8caed2146adf116f52c382c" 
    color: "green"
    name: "Strobealign-HRY"
    arguments: "--adna --ry-len 8 -M 500 --ssw"

  - commit: "4be2dcc208fa54a8c8caed2146adf116f52c382c"
    color: "green"
    name: "Strobealign-DK"
    arguments: "-l 1 -u 1 -M 500"

ends:
 - se

programs:
 - bwaaln
 - bwamem
 - bowtie2